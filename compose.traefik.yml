# Uso: docker compose -f compose.yml -f compose.traefik.yml up -d
# Requiere una red externa de Traefik (ver TRAEFIK_PUBLIC_NETWORK) y DNS
# wildcard *.${PUBLIC_BASE_DOMAIN} hacia el host que ejecuta Traefik.
# Ver dockerhost-fixes.md para los requisitos completos del host Docker
# donde corre Traefik.
#
# Solo el dashboard recibe labels aqui. El contenedor `app` (y la base de
# datos, si esta activada) no son servicios de Compose: el orquestador los
# crea directamente con sus propios labels de Traefik en cada despliegue
# (ver orchestrator/app.py, funcion activate()), porque el candidato debe
# poder pasar el chequeo de salud SIN estar conectado a `traefik-public`
# antes de recibir trafico real.
#
# Subdominios:
#   Panel:       https://panel-${INSTANCE_ID}.${PUBLIC_BASE_DOMAIN}
#   Aplicacion:  https://${INSTANCE_ID}.${PUBLIC_BASE_DOMAIN}  (activado por
#                el orquestador tras el primer despliegue exitoso)

services:
  dashboard:
    networks:
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_PUBLIC_NETWORK}
      traefik.http.routers.panel-${INSTANCE_ID}.rule: "Host(`panel-${INSTANCE_ID}.${PUBLIC_BASE_DOMAIN}`)"
      traefik.http.routers.panel-${INSTANCE_ID}.entrypoints: ${TRAEFIK_WEB_ENTRYPOINT}
      traefik.http.routers.panel-${INSTANCE_ID}.tls: "true"
      traefik.http.routers.panel-${INSTANCE_ID}.service: panel-${INSTANCE_ID}
      traefik.http.services.panel-${INSTANCE_ID}.loadbalancer.server.port: "${DASHBOARD_PORT}"

networks:
  traefik-public:
    external: true
    name: ${TRAEFIK_PUBLIC_NETWORK}
